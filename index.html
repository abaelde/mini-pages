<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mini-pages d'Aurélien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* Layout : une colonne courte ; une ligne par page, la plus récente en haut. */
:root {
  --bg: #f6f7fa;
  --surface: #ffffff;
  --ink: #1a1f2c;
  --muted: #5d6475;
  --line: #d9dde6;
  --accent: #2a4a98;
  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151c; --surface: #1a1e28; --ink: #e9ecf3; --muted: #a2a9b8; --line: #2e3442; --accent: #94adf2; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; }
.wrap { max-width: 40rem; margin: 0 auto; padding-inline: 16px; padding-block: 2rem 3rem; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.2rem, 8vw, 3rem); line-height: 1.05; margin: 0; }
.lead { color: var(--muted); margin: .4rem 0 1.6rem; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .7rem; }
a.page {
  display: grid; gap: .15rem; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; padding: .85rem 1rem;
}
a.page:hover { border-color: var(--accent); }
a.page:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.name { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
.meta { color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mini-pages</h1>
  <p class="lead">Des fiches à garder sous la main.</p>
  <ul>
    <li>
      <a class="page" href="bapteme-victor/">
        <span class="name">Baptême de Victor</span>
        <span class="meta">24 octobre 2026 · textes et réponses d'Aurélien, Floriane et Célestine</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
